# Genera el gráfico de contribuciones (en azul) cada día y lo publica en la rama "output".
name: Gráfico de contribuciones

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contribuciones.svg?color_snake=#1e90ff&color_dots=#ebedf0,#b8dcff,#6fb6ff,#1e90ff,#0a5fb8
            dist/contribuciones-oscuro.svg?palette=github-dark&color_snake=#00d4ff&color_dots=#0b1220,#0e3a66,#1366b8,#1e90ff,#00d4ff&color_background=#0b1220
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
