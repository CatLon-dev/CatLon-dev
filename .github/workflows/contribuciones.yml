# Genera el gráfico de contribuciones (en azul) cada día y lo publica en la rama "output".
name: Gráfico de contribuciones

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contribuciones.svg?color_snake=#ff1f3d&color_dots=#ebedf0,#ffc2ca,#ff7a8c,#ff1f3d,#a3001b
            dist/contribuciones-oscuro.svg?palette=github-dark&color_snake=#ff1f3d&color_dots=#121212,#40050d,#730013,#b8001d,#ff1f3d&color_background=#050505
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
