<svg xmlns="http://www.w3.org/2000/svg" width="900" height="120" viewBox="0 0 900 120">
<style>
  .t{font:700 22px 'JetBrains Mono','Cascadia Code',Consolas,Menlo,monospace;fill:#eafff2;letter-spacing:6px}
  .s{font:500 13px 'JetBrains Mono','Cascadia Code',Consolas,Menlo,monospace;fill:#7f9489;letter-spacing:3px}
  .gl{fill:#27c25c;opacity:0;animation:g 3.5s infinite steps(1)}
  .pulse{animation:m 2.6s linear infinite}
  @keyframes g{0%,88%,100%{opacity:0;transform:none}89%{opacity:.85;transform:translate(-5px,0)}92%{opacity:.6;transform:translate(4px,1px)}94%{opacity:0}}
  @keyframes m{from{transform:translateX(-200px)}to{transform:translateX(900px)}}
</style>
<defs><linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#27c25c" stop-opacity="0"/><stop offset=".5" stop-color="#9dffbf"/><stop offset="1" stop-color="#27c25c" stop-opacity="0"/></linearGradient></defs>
<line x1="0" y1="20" x2="900" y2="20" stroke="#27c25c" stroke-opacity=".35" stroke-width="2"/>
<rect class="pulse" x="0" y="18" width="200" height="4" fill="url(#lg)"/>
<text x="450.0" y="68" text-anchor="middle" class="t gl">// FIN DE LA TRANSMISION //</text>
<text x="450.0" y="68" text-anchor="middle" class="t">// FIN DE LA TRANSMISION //</text>
<text x="450.0" y="98" text-anchor="middle" class="s">CATLON-DEV.SYS :: CONEXION CERRADA</text>
</svg>